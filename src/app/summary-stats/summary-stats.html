<div class="row g-3 mb-4 summary-stats">
  <div class="col-6 col-lg-3">
    <div class="stat-tile">
      <div class="stat-value">{{ current().total | number }}</div>
      <div class="stat-label">Challengers</div>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="stat-tile stat-completed">
      <div class="stat-value">{{ current().completed | number }}</div>
      <div class="stat-label">Completed</div>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="stat-tile stat-active">
      <div class="stat-value">{{ current().active | number }}</div>
      <div class="stat-label">In progress</div>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="stat-tile stat-dead">
      <div class="stat-value">{{ current().dead | number }}</div>
      <div class="stat-label">Fallen</div>
    </div>
  </div>
</div>
